# SonarCloud automatic analysis settings.
# The EN/AR translation tables repeat the same key structure in two languages by design; that is parallel data,
# not duplicated logic, so they are excluded from copy-paste detection only (they are still analysed for issues).
# app/src/i18n/strings.ts is V1's table; app/src/i18n/shell.ts and the eight table files in app/src/i18n/screens/ (listed one by one so the
# *.test.ts files beside them stay checked) are the Kawalys app's per-screen tables (an `en` and an `ar` object with the same keys); app/src/lenses/i18n holds V2's
# ([English, Arabic] pairs per key). Only these copy tables are excluded; app code and specs are still checked.
sonar.cpd.exclusions=app/src/i18n/strings.ts,app/src/i18n/shell.ts,app/src/i18n/screens/agents.ts,app/src/i18n/screens/decisions.ts,app/src/i18n/screens/evidence.ts,app/src/i18n/screens/home.ts,app/src/i18n/screens/investigation.ts,app/src/i18n/screens/portfolio.ts,app/src/i18n/screens/project.ts,app/src/i18n/screens/sources.ts,app/src/lenses/i18n/*.ts

# docs/planning/G1 holds evaluation tooling (offline Python, Node and TS scripts run by hand on a synthetic fixture), not product code:
# it reads paths from the command line, uses a seeded PRNG for synthetic graphs and serves on localhost for a CSP test. Scoring it with the
# product security gate produced 46 alerts that do not apply. Only its scripts are excluded from analysis; the reports, data and every
# other path under docs/ are untouched, and app/ is still fully analysed.
sonar.exclusions=docs/planning/G1/**/*.py,docs/planning/G1/**/*.mjs,docs/planning/G1/**/*.js,docs/planning/G1/**/*.ts,docs/planning/G1/**/*.tsx
