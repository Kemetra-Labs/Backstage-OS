# SonarCloud automatic analysis settings.
# The EN/AR translation tables repeat the same key structure in two languages by design; that is parallel data,
# not duplicated logic, so they are excluded from copy-paste detection only (they are still analysed for issues).
# app/src/i18n/strings.ts is V1's table; app/src/i18n/shell.ts and the eight table files in app/src/i18n/screens/ (listed one by one so the
# *.test.ts files beside them stay checked) are the Kawalys app's per-screen tables (an `en` and an `ar` object with the same keys); app/src/design-lab/v2/i18n holds V2's
# ([English, Arabic] pairs per key). Only these copy tables are excluded; app code and specs are still checked.
sonar.cpd.exclusions=app/src/i18n/strings.ts,app/src/i18n/shell.ts,app/src/i18n/screens/agents.ts,app/src/i18n/screens/decisions.ts,app/src/i18n/screens/evidence.ts,app/src/i18n/screens/home.ts,app/src/i18n/screens/investigation.ts,app/src/i18n/screens/portfolio.ts,app/src/i18n/screens/project.ts,app/src/i18n/screens/sources.ts,app/src/design-lab/v2/i18n/*.ts
