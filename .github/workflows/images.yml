name: Images

# Manual build of the two pilot images (BACK-117). Never triggered by push or pull request: an operator dispatches it on main.
# It pushes ghcr.io/kemetra-labs/kawalys-bff and kawalys-web, then prints image@digest lines in the run summary; the
# deployment references those digests only (deploy/pilot/compose.deploy.yml). No runtime credential reaches the build:
# the only secret is the job's GITHUB_TOKEN, used to log in to GHCR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # The Descope project id the sign-in page is built for (D3(a)). It is a PUBLIC identifier, not a secret: it is the
  # project id that appears in every Descope API URL the browser calls. Passed to the web image build only.
  VITE_KAWALYS_DESCOPE_PROJECT_ID: P3MW4c80PMtyApvtGSONYmXy9fGt

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bff
        id: bff
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/pilot/server.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kemetra-labs/kawalys-bff:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and push web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/pilot/web.Dockerfile
          build-args: |
            VITE_KAWALYS_DESCOPE_PROJECT_ID=${{ env.VITE_KAWALYS_DESCOPE_PROJECT_ID }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kemetra-labs/kawalys-web:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Write digests to the run summary
        env:
          BFF_DIGEST: ${{ steps.bff.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo '### Pilot images (reference by digest only)'
            echo '```'
            echo "KAWALYS_BFF_IMAGE=ghcr.io/kemetra-labs/kawalys-bff@${BFF_DIGEST}"
            echo "KAWALYS_WEB_IMAGE=ghcr.io/kemetra-labs/kawalys-web@${WEB_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
