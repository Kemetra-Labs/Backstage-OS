name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium + webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # playwright.config.js starts `python -m http.server` as its webServer.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency needs lifecycle scripts; skip them (supply-chain hardening).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Call the lockfile-pinned binary directly instead of npx, which can
      # fetch and run unpinned packages on demand.
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      # BrowserStack (npm run test:browserstack) stays manual: it needs secrets
      # and shares the account's limited parallel sessions.
      - name: Run Playwright tests
        run: ./node_modules/.bin/playwright test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
