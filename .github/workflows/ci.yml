name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium + webkit)
    runs-on: ubuntu-latest
    # The root suite plus the app/ typecheck, unit and e2e suites took about 17 minutes on chromium + webkit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base commit

      # This check is required on main, so the job must always run and report.
      # Docs-only changes (*.md, docs/**) skip the browser steps but still pass.
      # Manual runs and anything ambiguous run the full suite.
      - name: Detect docs-only change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) BASE="" ;;
          esac
          bash .github/scripts/docs-only.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
          bash .github/scripts/g1-scorer-changed.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Docs-only change, skipping browser tests
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Only *.md or docs/ files changed; Playwright suite skipped."

      # The G1 scorer is executable Python under docs/, so the docs-only skip above never runs it. Run its
      # self-check whenever the scorer, fixture, schema or ground truth changes. Stdlib only: it uses the
      # python3 already on the runner, so docs-only PRs that do not touch it stay lightweight.
      - name: G1 scorer self-check
        if: steps.changes.outputs.g1_scorer == 'true'
        run: python3 -B docs/planning/G1/fixture/score.py --self-check

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # playwright.config.js starts `python -m http.server` as its webServer.
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: '3.12'

      # No dependency needs lifecycle scripts; skip them (supply-chain hardening).
      # The script also falls back to a private npm cache when ~/.npm is not writable (CircleCI EACCES).
      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: bash .github/scripts/npm-ci.sh

      # Call the lockfile-pinned binary directly instead of npx, which can
      # fetch and run unpinned packages on demand.
      - name: Install Playwright browsers
        if: steps.changes.outputs.docs_only != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      # BrowserStack (npm run test:browserstack) stays manual: it needs secrets
      # and shares the account's limited parallel sessions.
      - name: Run Playwright tests
        if: steps.changes.outputs.docs_only != 'true'
        run: ./node_modules/.bin/playwright test

      # The Kawalys React app in app/ has its own package.json, lockfile and
      # Playwright config (testDir ./e2e). The root suite above never runs it, so
      # without these steps nothing under app/ gates a merge. They live in this
      # job on purpose: it is the required check, and it keeps the docs-only skip.
      - name: Install app dependencies
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: app
        run: bash ../.github/scripts/npm-ci.sh

      - name: App typecheck and unit tests
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: app
        run: npm run check

      # Builds the app, then runs app/e2e against `vite preview` on chromium + webkit.
      - name: Run app Playwright tests
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: app
        run: npm run e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            app/test-results/
          retention-days: 7
